name: Actualizar web de consulta

# Cada vez que en el SIGO se pulsa "Exportar web de consulta", el index.html nuevo
# queda en una carpeta pública de Google Drive. Este proceso lo baja y lo publica.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bajar la última versión desde Drive
        run: |
          pip install --quiet gdown
          gdown --folder "https://drive.google.com/drive/folders/1TrPU3cUiFyjRYppbGpbEwReAbvRTHo5S" -O drive_web --remaining-ok
          ULT=$(ls drive_web/index_*.html 2>/dev/null | sort | tail -n 1)
          if [ -z "$ULT" ]; then echo "No hay index_*.html en la carpeta de Drive"; exit 1; fi
          echo "Última versión: $ULT"
          # control mínimo: debe ser una página completa y de tamaño razonable
          test $(stat -c%s "$ULT") -gt 1000000
          grep -q "IO_PUBLIC" "$ULT"
          cp "$ULT" index.html
          rm -rf drive_web

      - name: Publicar si cambió
        run: |
          git config user.name "sigo-bot"
          git config user.email "sigo-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualiza web de consulta ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            git push
          fi
